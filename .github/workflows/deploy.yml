# CI/CD: test -> build -> deploy to the production server. The server never builds; it only receives a
# finished bundle (deploy/scripts/receive-release.sh, run through a restricted SSH key).
#
# Repository settings needed (Settings -> Secrets and variables -> Actions):
#   Secrets:   DEPLOY_SSH_KEY      private key whose public half is in swachhdeploy@server authorized_keys
#              DEPLOY_KNOWN_HOSTS  output of: ssh-keyscan 76.13.243.27
#              ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#              RELEASE_PUBLISH_TOKEN  shared secret for publishing over-the-air web bundles; must equal
#                                 the backend's RELEASE_PUBLISH_TOKEN (docs/OTA_UPDATES.md)
#                                  the release signing key; the keystore is generated locally and never committed
#   Variables: (no Firebase web config any more: sign-in is the backend's own),
#              VITE_GOOGLE_MAPS_API_KEY (browser key, referrer-restricted; must allow https://localhost for the APK)
#              DEPLOY_HOST (76.13.243.27), BUILD_APK ('true' to build and publish the Android app)
#              PUBLISH_BUNDLE ('true' to publish the web bundle over the air after a deploy),
#              MIN_NATIVE_VERSION (oldest APK allowed to run the bundle; raise it with any native change),
#              RELEASE_CHANNEL_ROLLOUT (optional, 1-100: share of phones the release applies to),
#              APK_API_BASE_URL (optional) the API the APK talks to; defaults to https://ehk.itfarmer.in/api/v1.
#                               The APK is served from https://localhost by its WebView, so unlike the PWA it
#                               cannot use a relative /api/v1, and that origin must be in the backend's CORS_ORIGINS.
name: test-build-deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx vitest run

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: backend/pyproject.toml }
      - run: pip install -e 'backend[test]'
      - run: cd backend && python -m pytest -o addopts="" -W ignore -q

  build-web:
    needs: [test-web, test-backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Build PWA (production, demo mode off)
        env:
          # A browser key, restricted by HTTP referrer, and expected to be in the bundle: that is how the
          # Maps JS API is keyed (see src/services/googleMaps.js). Unset, every map falls back to showing
          # coordinates, which is what had been happening -- the variable was never passed here at all.
          VITE_GOOGLE_MAPS_API_KEY: ${{ vars.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_DEMO_MODE: 'false'
        run: npx vite build --outDir web
      - name: Refuse secrets or demo mode in the bundle
        run: |
          ! grep -rlE 'BEGIN (RSA )?PRIVATE KEY|"private_key"|OTP_PEPPER|DATABASE_URL|POSTGRES_PASSWORD' web
          ! grep -rq 'Demo mode: records are not saved' web/assets
          test -s web/index.html && test -s web/serviceWorker.js
      - uses: actions/upload-artifact@v4
        with: { name: web, path: web, retention-days: 14 }

  build-apk:
    if: vars.BUILD_APK == 'true'
    needs: [test-web, test-backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 22+: the Capacitor 8 CLI refuses to run on Node 20. The web jobs stay on the Node they are
      # tested with; only this job needs the newer one.
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      # Capacitor 8 builds with JDK 21 (android/app/capacitor.build.gradle sets source/target 21).
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      # v4 or newer: v3 installs the obsolete SDK package "tools", which Google no longer publishes, so it
      # fails before the build starts. Licences are accepted without printing all of them into the log.
      - uses: android-actions/setup-android@v4
        with: { log-accepted-android-sdk-licenses: false }
      - run: npm ci
      # The APK's pages are served from https://localhost by the WebView, so a relative /api/v1 would point
      # at the app's own assets: this build, and only this build, carries the server's absolute API base.
      - env:
          # The APK's pages are served from https://localhost by the WebView, so this key's referrer
          # restrictions have to allow that as well as the site's own host, or maps load on the web and
          # are refused in the app.
          VITE_GOOGLE_MAPS_API_KEY: ${{ vars.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_DEMO_MODE: 'false'
          VITE_API_BASE_URL: ${{ vars.APK_API_BASE_URL || 'https://ehk.itfarmer.in/api/v1' }}
          VITE_BUILD_SHA: ${{ github.sha }}
        run: npx vite build && npx cap sync android
      - name: Build and sign release APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Tolerate the line breaks and CRs that copying base64 through a terminal or the web UI adds,
          # then check the result really is the keystore before a 4-minute build depends on it.
          printf '%s' "$KEYSTORE_B64" | tr -d '\r\n \t' | base64 -d > "$RUNNER_TEMP/release.jks"
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" \
                 -storepass:env ANDROID_KEYSTORE_PASSWORD >/dev/null 2>&1; then
            echo "::error::ANDROID_KEYSTORE_B64 does not decode to a keystore that ANDROID_KEYSTORE_PASSWORD opens."
            echo "Re-create it with:  base64 -w0 release.jks   (Linux/macOS)"
            echo "or: [Convert]::ToBase64String([IO.File]::ReadAllBytes('release.jks'))  (PowerShell)"
            echo "and paste the whole single line, with nothing added around it."
            exit 1
          fi
          # versionCode is the version in package.json plus this run's number (android/app/build.gradle),
          # so every release Android is offered has a higher code than the one it replaces.
          cd android && ./gradlew assembleRelease -PswachhBuild=${{ github.run_number }}
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "$ANDROID_KEY_ALIAS" --key-pass env:ANDROID_KEY_PASSWORD --out ../app.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify ../app.apk
          rm -f "$RUNNER_TEMP/release.jks"
      # What /downloads/latest.json will say about this release: read from the signed APK itself, never
      # written by hand. The server adds the commit id and the file name (deploy/scripts/receive-release.sh).
      - name: Describe the release
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump badging app.apk > badging.txt
          if grep -q application-debuggable badging.txt; then echo "Refusing: debuggable release build"; exit 1; fi
          "$BT/apksigner" verify --print-certs app.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -n1 > cert.txt
          python3 scripts/describe-apk.py app.apk badging.txt cert.txt > apk.json
          cat apk.json
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            app.apk
            apk.json
          retention-days: 30

  # The over-the-air web bundle: the same web code as build-apk, built with the same absolute API base,
  # zipped and handed to the server. This is what reaches phones without a Play Store release -- screens,
  # business logic, fixes, new features. Anything under android/ still needs build-apk and an install.
  #
  # Published, not released: the upload records the bundle, and pointing the channel at it is a separate
  # call. RELEASE_CHANNEL_ROLLOUT decides how much of the fleet the pointer applies to (10 = watch it on a
  # tenth of the phones first); unset means everybody. With PUBLISH_BUNDLE unset, this job does not run and
  # the pipeline behaves exactly as it did before.
  publish-bundle:
    if: vars.PUBLISH_BUNDLE == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test-web, test-backend, deploy]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      # Built with the APK's environment, not the PWA's: the WebView serves from https://localhost, so the
      # bundle must carry the absolute API base or every request lands on the app's own files. Publishing
      # refuses a bundle whose base is relative, which is this mistake caught rather than shipped.
      - name: Build the web bundle (APK flavour)
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ vars.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_DEMO_MODE: 'false'
          VITE_API_BASE_URL: ${{ vars.APK_API_BASE_URL || 'https://ehk.itfarmer.in/api/v1' }}
          VITE_BUILD_SHA: ${{ github.sha }}
        run: npx vite build --outDir bundle-web
      - name: Refuse secrets or demo mode in the bundle
        run: |
          ! grep -rlE 'BEGIN (RSA )?PRIVATE KEY|"private_key"|OTP_PEPPER|DATABASE_URL|POSTGRES_PASSWORD' bundle-web
          ! grep -rq 'Demo mode: records are not saved' bundle-web/assets
          test -s bundle-web/index.html && test -s bundle-web/serviceWorker.js
          ls bundle-web/assets/*.wasm >/dev/null
      # MIN_NATIVE_VERSION is the oldest APK allowed to run this bundle. Raise it in the same commit that
      # adds a native plugin method the web code starts calling, or phones on the older APK will be handed
      # a bundle that cannot start -- and a phone whose bundle does not start cannot ask for a better one.
      - name: Publish and release
        # Everything below reaches the script through the environment, never spliced into the command
        # line. A commit message is text somebody else wrote: interpolating it into a shell script runs
        # it, on a runner holding the deploy SSH key and the publish token, and even an honest message
        # breaks the step the moment it contains an apostrophe or a second line. Quoted "$VAR" is not
        # re-parsed by the shell, so the message stays data.
        env:
          RELEASE_API_BASE: ${{ vars.APK_API_BASE_URL || 'https://ehk.itfarmer.in/api/v1' }}
          RELEASE_PUBLISH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
          VITE_API_BASE_URL: ${{ vars.APK_API_BASE_URL || 'https://ehk.itfarmer.in/api/v1' }}
          GITHUB_SHA: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
          MIN_NATIVE: ${{ vars.MIN_NATIVE_VERSION || '0.0.0' }}
          ROLLOUT: ${{ vars.RELEASE_CHANNEL_ROLLOUT || 100 }}
          COMMIT_NOTES: ${{ github.event.head_commit.message }}
        run: |
          node scripts/publish-bundle.mjs \
            --dir bundle-web \
            --build "$BUILD_NUMBER" \
            --min-native "$MIN_NATIVE" \
            --rollout "$ROLLOUT" \
            --notes "$COMMIT_NOTES" \
            --release

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !cancelled() && needs.build-web.result == 'success' && needs.build-apk.result != 'failure'
    needs: [build-web, build-apk]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with: { name: web, path: bundle/web }
      - uses: actions/download-artifact@v4
        if: needs.build-apk.result == 'success'
        with: { name: apk, path: bundle }
      - name: Send the bundle to the server (it runs receive-release, nothing else)
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          echo "${{ github.sha }}" > bundle/SHA
          install -m 600 /dev/null ~/key && echo "$SSH_KEY" > ~/key
          mkdir -p ~/.ssh && echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          tar -C bundle -czf - . | ssh -i ~/key -o BatchMode=yes swachhdeploy@"$HOST"
