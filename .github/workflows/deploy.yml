# CI/CD: test -> build -> deploy to the production server. The server never builds; it only receives a
# finished bundle (deploy/scripts/receive-release.sh, run through a restricted SSH key).
#
# Repository settings needed (Settings -> Secrets and variables -> Actions):
#   Secrets:   DEPLOY_SSH_KEY      private key whose public half is in swachhdeploy@server authorized_keys
#              DEPLOY_KNOWN_HOSTS  output of: ssh-keyscan 76.13.243.27
#              ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#                                  the release signing key; the keystore is generated locally and never committed
#   Variables: VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN, VITE_FIREBASE_PROJECT_ID,
#              VITE_FIREBASE_STORAGE_BUCKET, VITE_FIREBASE_MESSAGING_SENDER_ID, VITE_FIREBASE_APP_ID (public web config)
#              DEPLOY_HOST (76.13.243.27), BUILD_APK ('true' to build and publish the Android app)
#              APK_API_BASE_URL (optional) the API the APK talks to; defaults to https://ehk.itfarmer.in/api/v1.
#                               The APK is served from https://localhost by its WebView, so unlike the PWA it
#                               cannot use a relative /api/v1, and that origin must be in the backend's CORS_ORIGINS.
name: test-build-deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx vitest run

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: backend/pyproject.toml }
      - run: pip install -e 'backend[test]'
      - run: cd backend && python -m pytest -o addopts="" -W ignore -q

  build-web:
    needs: [test-web, test-backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Build PWA (production, demo mode off)
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_DEMO_MODE: 'false'
        run: npx vite build --outDir web
      - name: Refuse secrets or demo mode in the bundle
        run: |
          ! grep -rlE 'BEGIN (RSA )?PRIVATE KEY|"private_key"|OTP_PEPPER|DATABASE_URL|POSTGRES_PASSWORD' web
          ! grep -rq 'Demo mode: records are not saved' web/assets
          test -s web/index.html && test -s web/serviceWorker.js
      - uses: actions/upload-artifact@v4
        with: { name: web, path: web, retention-days: 14 }

  build-apk:
    if: vars.BUILD_APK == 'true'
    needs: [test-web, test-backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 22+: the Capacitor 8 CLI refuses to run on Node 20. The web jobs stay on the Node they are
      # tested with; only this job needs the newer one.
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      # Capacitor 8 builds with JDK 21 (android/app/capacitor.build.gradle sets source/target 21).
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      # v4 or newer: v3 installs the obsolete SDK package "tools", which Google no longer publishes, so it
      # fails before the build starts. Licences are accepted without printing all of them into the log.
      - uses: android-actions/setup-android@v4
        with: { log-accepted-android-sdk-licenses: false }
      - run: npm ci
      # The APK's pages are served from https://localhost by the WebView, so a relative /api/v1 would point
      # at the app's own assets: this build, and only this build, carries the server's absolute API base.
      - env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_DEMO_MODE: 'false'
          VITE_API_BASE_URL: ${{ vars.APK_API_BASE_URL || 'https://ehk.itfarmer.in/api/v1' }}
          VITE_BUILD_SHA: ${{ github.sha }}
        run: npx vite build && npx cap sync android
      - name: Build and sign release APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cd android && ./gradlew assembleRelease
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "$ANDROID_KEY_ALIAS" --key-pass env:ANDROID_KEY_PASSWORD --out ../app.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify ../app.apk
          rm -f "$RUNNER_TEMP/release.jks"
      # What /downloads/latest.json will say about this release: read from the signed APK itself, never
      # written by hand. The server adds the commit id and the file name (deploy/scripts/receive-release.sh).
      - name: Describe the release
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump badging app.apk > badging.txt
          if grep -q application-debuggable badging.txt; then echo "Refusing: debuggable release build"; exit 1; fi
          "$BT/apksigner" verify --print-certs app.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -n1 > cert.txt
          python3 scripts/describe-apk.py app.apk badging.txt cert.txt > apk.json
          cat apk.json
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            app.apk
            apk.json
          retention-days: 30

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !cancelled() && needs.build-web.result == 'success' && needs.build-apk.result != 'failure'
    needs: [build-web, build-apk]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with: { name: web, path: bundle/web }
      - uses: actions/download-artifact@v4
        if: needs.build-apk.result == 'success'
        with: { name: apk, path: bundle }
      - name: Send the bundle to the server (it runs receive-release, nothing else)
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          echo "${{ github.sha }}" > bundle/SHA
          install -m 600 /dev/null ~/key && echo "$SSH_KEY" > ~/key
          mkdir -p ~/.ssh && echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          tar -C bundle -czf - . | ssh -i ~/key -o BatchMode=yes swachhdeploy@"$HOST"
