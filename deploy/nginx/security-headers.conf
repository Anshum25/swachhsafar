# Security headers for the Swachh Safar PWA. Single source of truth: nginx includes this file, and
# `vite preview` reads the same lines when PREVIEW_SECURITY_HEADERS=1 (vite.config.js), so every
# Playwright e2e test runs the production build under exactly this Content-Security-Policy.
# Format the preview parser understands: one `add_header Name "value" always;` per line.
#
# CSP notes
#   script-src  'wasm-unsafe-eval'   SQLite WASM (compiling WebAssembly); no JS eval is allowed.
#               First-party scripts, plus the Google Maps JavaScript API (maps.googleapis.com and the
#               map tiles/modules it loads from maps.gstatic.com) for the capture-location map on
#               attendance (src/services/googleMaps.js, loaded only when a map is shown).
#   connect-src storage.googleapis.com (signed media URLs, STORAGE_BACKEND=firebase only),
#               maps.googleapis.com (map tiles and browser-side reverse geocoding). /api/v1 is
#               same-origin, and sign-in is /api/v1/auth: no third-party identity provider.
#   img/media   blob: previews of media held in OPFS; data: icons; signed Firebase Storage URLs;
#               map tiles and marker sprites from maps.googleapis.com, maps.gstatic.com and the
#               khms*.googleapis.com tile hosts.
#   font-src    fonts.gstatic.com: the Roboto face the Maps JS API asks for (it falls back silently).
#   frame-src   'none': the app embeds no frames. The map is built with disableDefaultUI, so it needs
#               none either (Street View and "report a problem" would).
#   style-src   'unsafe-inline' is kept for library-injected styles; no script is allowed inline.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://maps.googleapis.com https://maps.gstatic.com; worker-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://storage.googleapis.com https://www.google.com https://maps.googleapis.com https://maps.gstatic.com https://*.googleapis.com https://*.gstatic.com; media-src 'self' blob: https://storage.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://storage.googleapis.com https://maps.googleapis.com; frame-src 'none'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=(), usb=(), bluetooth=(), serial=(), hid=()" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header X-Frame-Options "DENY" always;
# HSTS for the domain only ($swachh_hsts is set by a map in swachhsafar.conf; empty = not sent). Not read by
# the preview parser (unquoted variable), so local http e2e runs are unaffected.
add_header Strict-Transport-Security $swachh_hsts always;
