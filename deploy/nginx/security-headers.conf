# Security headers for the Swachh Safar PWA. Single source of truth: nginx includes this file, and
# `vite preview` reads the same lines when PREVIEW_SECURITY_HEADERS=1 (vite.config.js), so every
# Playwright e2e test runs the production build under exactly this Content-Security-Policy.
# Format the preview parser understands: one `add_header Name "value" always;` per line.
#
# CSP notes
#   script-src  'wasm-unsafe-eval'   SQLite WASM (compiling WebAssembly); no JS eval is allowed.
#               Only first-party scripts: Auth is initialised without the popup/redirect resolver
#               (src/services/firebase.js), so no apis.google.com script and no auth iframe load.
#   connect-src Firebase Auth (identitytoolkit, securetoken), Firestore (registration profile),
#               storage.googleapis.com (signed media URLs). /api/v1 is same-origin.
#   img/media   blob: previews of media held in OPFS; data: icons; signed Firebase Storage URLs;
#               www.google.com/images/cleardot.gif is Firestore WebChannel's connectivity probe.
#   frame-src   'none': the app embeds no frames.
#   style-src   'unsafe-inline' is kept for library-injected styles; no script is allowed inline.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://storage.googleapis.com https://www.google.com; media-src 'self' blob: https://storage.googleapis.com; font-src 'self'; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com https://storage.googleapis.com; frame-src 'none'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=(), usb=(), bluetooth=(), serial=(), hid=()" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header X-Frame-Options "DENY" always;
