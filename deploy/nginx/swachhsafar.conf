# Swachh Safar 2.0 — PWA + FastAPI on https://76.13.243.27:8082
# Installed as /etc/nginx/sites-available/swachhsafar (symlinked from sites-enabled).
#
# TLS: active.crt/active.key are symlinks to the certificate in use:
#   - Let's Encrypt 6-day IP certificate (deploy/scripts/enable-letsencrypt-ip.sh), trusted by every phone, or
#   - the private, IP-constrained "Swachh Safar Device CA" fallback (deploy/scripts/make-ip-cert.sh).
# HSTS is intentionally absent: browsers ignore it for IP-address hosts (RFC 6797 §8.1.1).
#
# Note on nginx inheritance: a location with its own add_header drops every server-level add_header,
# so each such location includes the security headers again.

# Per-client-IP API rate limit. Generous on purpose: many phones on Indian mobile networks share one
# carrier-NAT address, and a device draining its outbox sends bursts of requests.
limit_req_zone $binary_remote_addr zone=swachh_api:10m rate=30r/s;

upstream swachh_api_backend {
    server 127.0.0.1:8010;
    keepalive 16;
}

server {
    listen 8082 ssl http2;
    server_name 76.13.243.27 _;

    ssl_certificate     /etc/swachhsafar/tls/active.crt;
    ssl_certificate_key /etc/swachhsafar/tls/active.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:swachh_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Plain http:// to this port: send the browser to https:// on the same port.
    error_page 497 =301 https://$host:$server_port$request_uri;

    root /var/www/html/swachhsafar2.0/current;
    index index.html;
    server_tokens off;
    charset utf-8;

    access_log /var/log/nginx/swachhsafar.access.log;
    error_log  /var/log/nginx/swachhsafar.error.log warn;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml application/wasm;

    include /etc/swachhsafar/nginx/security-headers.conf;

    # ---- API: never cached by the browser or any proxy; the service worker never caches it either ----
    location /api/ {
        limit_req zone=swachh_api burst=120 nodelay;
        limit_req_status 429;
        # Inspection video ≤ 25 MB on the device; headroom for multipart framing.
        client_max_body_size 30m;
        client_body_timeout 120s;
        proxy_request_buffering on;

        proxy_pass http://swachh_api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        add_header Cache-Control "no-store" always;
        include /etc/swachhsafar/nginx/security-headers.conf;
    }

    location = /health {
        proxy_pass http://swachh_api_backend;
        proxy_set_header Host $host;
        access_log off;
    }

    # ---- Files that decide which version runs: always revalidated ----
    location = /serviceWorker.js {
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
        include /etc/swachhsafar/nginx/security-headers.conf;
    }
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache" always;
        include /etc/swachhsafar/nginx/security-headers.conf;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/swachhsafar/nginx/security-headers.conf;
    }

    # ---- Content-hashed build output: cache forever ----
    location /assets/ {
        # No `always`: only successful responses are cacheable forever, never a 404.
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/swachhsafar/nginx/security-headers.conf;
        # A missing hashed chunk is a 404, never index.html served as JavaScript.
        try_files $uri =404;
    }

    # Private CA certificate for phones (public data; verify its SHA-256 fingerprint before installing).
    location = /swachhsafar-ca.crt {
        alias /etc/swachhsafar/tls/ca.crt;
        types { application/x-x509-ca-cert crt; }
        add_header Content-Disposition 'attachment; filename="swachhsafar-ca.crt"' always;
        add_header Cache-Control "no-cache" always;
        include /etc/swachhsafar/nginx/security-headers.conf;
    }

    # Icons and other static files at the root.
    location ~* \.(png|ico|svg)$ {
        add_header Cache-Control "public, max-age=86400";
        include /etc/swachhsafar/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # Single-page app: every other path is the app shell (hash routes need no server support).
    location / {
        add_header Cache-Control "no-cache" always;
        include /etc/swachhsafar/nginx/security-headers.conf;
        try_files $uri /index.html;
    }
}
