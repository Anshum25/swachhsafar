# Swachh Safar 2.0 — PWA + FastAPI
#   https://ehk.itfarmer.in          (public; proxied by Cloudflare; Let's Encrypt certificate via certbot)
#   https://76.13.243.27:8082        (direct IP; Let's Encrypt 6-day IP certificate via lego) — kept so phones
#                                     that installed the app from the IP address can sync; their data lives there.
# Installed as /etc/nginx/sites-available/swachhsafar. The app itself: /etc/swachhsafar/nginx/app.conf.
# No `http2` on :443: on a shared port it would switch HTTP/2 on for every other site there too.

# Per-client-IP API rate limit (the real client IP: behind Cloudflare it comes from CF-Connecting-IP).
# Generous on purpose: many phones on Indian mobile networks share one carrier-NAT address.
limit_req_zone $binary_remote_addr zone=swachh_api:10m rate=30r/s;

upstream swachh_api_backend {
    server 127.0.0.1:8010;
    keepalive 16;
}

# HSTS only for the domain (browsers ignore it for IP addresses). Empty value = header not sent.
map $host $swachh_hsts {
    ehk.itfarmer.in "max-age=31536000";
    default "";
}

# ---- https://ehk.itfarmer.in ------------------------------------------------------------------------------
server {
    listen 80;
    server_name ehk.itfarmer.in;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name ehk.itfarmer.in;

    ssl_certificate     /etc/letsencrypt/live/ehk.itfarmer.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ehk.itfarmer.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Real visitor address from Cloudflare (ranges from https://www.cloudflare.com/ips, 2026-11-05).
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    access_log /var/log/nginx/swachhsafar.access.log;
    error_log  /var/log/nginx/swachhsafar.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    include /etc/swachhsafar/nginx/app.conf;
}

# ---- https://76.13.243.27:8082 (direct IP) ----------------------------------------------------------------
server {
    listen 8082 ssl http2;
    server_name 76.13.243.27 _;

    ssl_certificate     /etc/swachhsafar/tls/active.crt;
    ssl_certificate_key /etc/swachhsafar/tls/active.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:swachh_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Plain http:// to this port: send the browser to https:// on the same port.
    error_page 497 =301 https://$host:$server_port$request_uri;

    access_log /var/log/nginx/swachhsafar.access.log;
    error_log  /var/log/nginx/swachhsafar.error.log warn;

    include /etc/swachhsafar/nginx/app.conf;
}
